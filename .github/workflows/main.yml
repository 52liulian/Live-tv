name: Update playlist

on:
  schedule:
    # 每 3 天一次：UTC 21:45 触发，对应北京时间次日 05:45。
    # cron 无法表达严格的“每 72 小时”，这里用“每月 1/4/7…31 日”近似，月末跨月会差 1-3 天。
    - cron: '45 21 */3 * *'
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure GitHub Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Record revision and state key
      id: source
      env:
        CONFIG_HASH: ${{ hashFiles('config/*.txt', 'config/*.py') }}
      run: |
        echo "state_prefix=livetv-state-v1-${RUNNER_OS}-${CONFIG_HASH}-" >> "$GITHUB_OUTPUT"
        echo "state_key=livetv-state-v1-${RUNNER_OS}-${CONFIG_HASH}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

    - name: Restore result history
      uses: actions/cache/restore@v4
      with:
        path: |
          output/data/cache.gz
          output/data/frozen.gz
        key: ${{ steps.source.outputs.state_key }}
        restore-keys: ${{ steps.source.outputs.state_prefix }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Python script
      env:
        LIVETV_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      run: python main.py

    - name: Build Pages site
      env:
        PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      run: |
        python scripts/publish_results.py \
          --pages-destination pages-site \
          --pages-base-url "${PAGES_BASE_URL%/}"

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: pages-site

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # open_auto_disable_source 会注释掉 config 中的失效源；这类改动不提交到仓库，
        # 仅在本地/服务器部署时持久保存。这里在提交前还原源文件，避免污染仓库。
        if ! git diff --quiet -- config/subscribe.txt config/epg.txt; then
          echo "::warning::自动停用修改了 config/ 下的源文件，这些改动不会提交到仓库。"
        fi
        git checkout -- config/subscribe.txt config/epg.txt 2>/dev/null || true
        git add -A
        # output/ 已整体忽略,结果只经 Pages 发布;正常情况下无变更可提交,
        # 此步骤仅作为兜底(如配置校验等意外产生的文件变动)
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update"
          git push
        fi

    - name: Save result history
      if: always() && (hashFiles('output/data/cache.gz') != '' || hashFiles('output/data/frozen.gz') != '')
      uses: actions/cache/save@v4
      with:
        path: |
          output/data/cache.gz
          output/data/frozen.gz
        key: ${{ steps.source.outputs.state_key }}

    env:
      TZ: Asia/Shanghai

  deploy-pages:
    needs: run_script
    if: always() && needs.run_script.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
